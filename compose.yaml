services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DB_PATH: /data/tasks.db
      PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
      - api_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 15
    init: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    init: true

volumes:
  api_data:
  api_node_modules:
  web_node_modules:
